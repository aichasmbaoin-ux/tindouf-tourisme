<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير متصل بالإنترنت | مديرية السياحة لولاية تندوف</title>
  <meta name="theme-color" content="#065f46">
  <link rel="icon" type="image/png" href="/pwa-192x192.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #fafaf9;
      color: #1c1917;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 1.5rem;
      padding: 2rem 1.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: #fef3c7;
      color: #92400e;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      background: #ecfdf5;
      color: #065f46;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 1.25rem;
      color: #065f46;
      font-weight: 800;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.9rem;
      color: #57534e;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn-primary {
      background: #065f46;
      color: #ffffff;
      border: none;
      padding: 0.85rem 1.25rem;
      border-radius: 0.85rem;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #047857;
    }
    .btn-secondary {
      background: #f5f5f4;
      color: #292524;
      border: 1px solid #d6d3d1;
      padding: 0.85rem 1.25rem;
      border-radius: 0.85rem;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <span class="badge">وضع التصفح دون إنترنت</span>
    <h1>أنت غير متصل بالإنترنت حالياً</h1>
    <p>
      تطبيق مديرية السياحة لولاية تندوف يدعم العمل أوفلاين. يمكنك العودة إلى الصفحة الرئيسية لتصفح المسالك والمعالم المخزنة مسبقاً في هاتفك.
    </p>
    <div class="btn-group">
      <button class="btn-primary" onclick="window.location.reload()">إعادة المحاولة 🔄</button>
      <a class="btn-secondary" href="/">الصفحة الرئيسية المحفوظة 🏠</a>
    </div>
  </div>
</body>
</html>
